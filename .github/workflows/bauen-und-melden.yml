# Gemeinsame Bauvorlage für alle Seiten.
#
# Ein Seitenrepo ruft sie auf und beschreibt sich selbst in seiner
# auslieferung.toml. Damit liegt die Logik einmal hier statt zwanzigmal
# verstreut, und eine Verbesserung erreicht alle Seiten.
#
# Sie baut, prüft, stempelt die Fassung ins HTML, legt das Ergebnis als
# Release-Asset ab und meldet es der Werkstatt. Ausgeliefert wird hier
# nichts: die Zugangsdaten der Kundenwebspaces liegen auf der Werkstatt,
# nicht auf GitHub.

name: Bauen und melden

on:
  workflow_call:
    inputs:
      knoten:
        description: Node-Fassung, falls gebaut wird
        type: string
        default: "22"
      nur_bei_aenderung:
        description: >
          Fuer das naechtliche Nachbacken: nur bauen, wenn sich der Aushang
          heute anders zeigt als gestern. An den meisten Tagen ist das bei
          keiner Seite der Fall, und dann endet der Lauf nach zehn Sekunden.
        type: boolean
        default: false
    secrets:
      MELDEN_URL:
        description: Adresse des ausrollers auf der Werkstatt
        required: false
      MELDEN_GEHEIMNIS:
        description: gemeinsames Geheimnis für die HMAC-Signatur
        required: false

permissions:
  contents: write          # für das Release

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── Die Seite beschreibt sich selbst ────────────────────────────────
      - name: auslieferung.toml lesen
        id: beschreibung
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys, tomllib, pathlib

          pfad = pathlib.Path("auslieferung.toml")
          if not pfad.exists():
              sys.exit("auslieferung.toml fehlt — siehe werk-vorlagen/README.md")
          k = tomllib.loads(pfad.read_text())

          if "name" not in k:
              sys.exit("auslieferung.toml: name fehlt")

          # Eine Seite hat immer eine Vorschau und hoechstens ein Ziel. Die
          # Vorschau ist der Ort, an dem der Kunde abnimmt; das Ziel ist da,
          # wo die Seite spaeter oeffentlich steht. Beim Bau spielt beides
          # keine Rolle — die Pruefung steht hier, damit ein Fehler beim
          # Bau auffaellt und nicht erst, wenn der ausroller danebengreift.
          erlaubt = {"rsync", "sftp", "ftp", "dienst"}
          for wo in ("vorschau", "ziel"):
              block = k.get(wo)
              if block is None:
                  if wo == "vorschau":
                      sys.exit("auslieferung.toml: [vorschau] fehlt")
                  continue
              if wo == "ziel" and not block.get("aktiv", False):
                  continue          # noch nicht scharf, Felder duerfen leer sein
              if block.get("art") not in erlaubt:
                  sys.exit(f"[{wo}] art={block.get('art')!r} unbekannt, "
                           f"erlaubt: {sorted(erlaubt)}")
              for feld in ("host", "pfad"):
                  if not block.get(feld):
                      sys.exit(f"[{wo}] {feld} fehlt")

          # Seiten ohne Bau liefern aus dem Repo aus. Was dort liegt, aber
          # nicht auf den Webserver gehoert, steht hier — etwa eine
          # nginx.conf, die im Webwurzelverzeichnis oeffentlich einsehbar waere.
          zusatz = k.get("nicht_ausliefern", [])
          if not isinstance(zusatz, list) or any(not isinstance(x, str) for x in zusatz):
              sys.exit("nicht_ausliefern muss eine Liste von Zeichenketten sein")

          print(f"name={k['name']}")
          print(f"bauen={k.get('bauen', '')}")
          print(f"ergebnis={k.get('ergebnis', '.')}")
          print("zusatz=" + " ".join(f"--exclude={x}" for x in zusatz))
          PY

      # ── Die Fassung ─────────────────────────────────────────────────────
      # Bis 7.9.2026 war die Fassung schlicht der Commit-Hash. Damit war das
      # naechtliche Nachbacken wirkungslos: gleicher Commit, gleicher Tag,
      # gleicher Stempel — der ausroller verglich, sah dasselbe und holte
      # nichts. Ein Urlaub, der heute beginnt, stand deshalb nie im
      # ausgelieferten HTML; nur das Skript im Browser rechnete richtig.
      #
      # Mit dem Backdatum unterscheiden sich zwei Baeue desselben Commits.
      # Der Hash bleibt vorn, damit man weiter sieht, WAS ausgeliefert ist —
      # das Datum sagt nur, WANN es gebacken wurde.
      - name: Fassung bestimmen
        id: fassung
        run: |
          echo "fassung=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Fassung: ${GITHUB_SHA::7}-$(date -u +%Y%m%d)"

      # ── Nachbacken: aendert sich heute ueberhaupt etwas? ─────────────────
      # Die Frage beantwortet die aushang-Bibliothek selbst — dieselbe
      # Logik, die auch die Seite rechnet. Sie in einem Cron-Skript
      # nachzubauen hiesse, Zeitlogik zweimal zu haben, und die zweite
      # Fassung waere die, die still falsch wird.
      - name: Aushang-Wechsel pruefen
        id: wechsel
        if: inputs.nur_bei_aenderung
        run: |
          # Die Bibliothek ist eingebaut, nicht eingebunden — sie liegt
          # unter src/aushang/ im Repo selbst. Der Grund steht in
          # felixrath/aushang: ein privates Repo als npm-Abhaengigkeit
          # braeuchte hier ein Geheimnis je Seitenrepo.
          if [ ! -f aushang.toml ] || [ ! -d src/aushang ]; then
            echo "kein Aushang — nichts nachzubacken"
            echo "noetig=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm ci --silent
          cat > /tmp/wechsel.ts <<'TS'
          import { readFileSync } from 'node:fs';
          import { parse } from 'smol-toml';
          import { AushangSchema } from './src/aushang/src/schema.ts';
          import { wechseltAm, ortsZeit } from './src/aushang/src/aushang.ts';

          const a = AushangSchema.parse(parse(readFileSync('aushang.toml', 'utf8')));
          console.log(wechseltAm(a, ortsZeit(new Date(), a.zeitzone).datum) ? 'ja' : 'nein');
          TS
          sed -i 's/^          //' /tmp/wechsel.ts
          cp /tmp/wechsel.ts ./wechsel.probe.ts
          npx tsx ./wechsel.probe.ts > /tmp/wechsel.txt
          rm -f ./wechsel.probe.ts
          echo "noetig=$(cat /tmp/wechsel.txt)" >> "$GITHUB_OUTPUT"
          echo "Wechsel heute: $(cat /tmp/wechsel.txt)"

      - name: Nichts zu tun
        if: inputs.nur_bei_aenderung && steps.wechsel.outputs.noetig != 'ja'
        run: echo "Der Aushang zeigt heute dasselbe wie gestern — kein Neubau."

      # ── Bauen, sofern es etwas zu bauen gibt ────────────────────────────
      - uses: actions/setup-node@v5
        if: >-
          steps.beschreibung.outputs.bauen != ''
          && (!inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja')
        with:
          node-version: ${{ inputs.knoten }}
          cache: npm

      - name: Abhängigkeiten
        if: >-
          steps.beschreibung.outputs.bauen != ''
          && (!inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja')
        run: npm ci

      # Läuft vor dem Bau: bricht bei fehlerhafter Zeitlogik ab, bevor
      # irgendetwas ausgeliefert wird. Fehlt ein test-Skript, wird
      # übersprungen statt zu scheitern.
      - name: Prüfungen
        if: >-
          steps.beschreibung.outputs.bauen != ''
          && (!inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja')
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            npm test
          else
            echo "kein test-Skript — übersprungen"
          fi
          if node -e "process.exit(require('./package.json').devDependencies?.astro||require('./package.json').dependencies?.astro?0:1)"; then
            npx astro check
          fi

      - name: Bauen
        if: >-
          steps.beschreibung.outputs.bauen != ''
          && (!inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja')
        run: ${{ steps.beschreibung.outputs.bauen }}

      # ── Fassung stempeln ────────────────────────────────────────────────
      # Der Stempel ist der einzige verlässliche Beleg dafür, dass beim
      # Kunden auch wirklich das Neue steht — auf FTP-Zielen gibt es sonst
      # keinen. Er dient später auch der Wache: weicht die Fassung auf einer
      # Kundenseite von der zuletzt ausgelieferten ab, hat jemand von Hand
      # etwas geändert.
      - name: Fassung ins HTML stempeln
        if: ${{ !inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          wurzel = pathlib.Path(os.environ["ERGEBNIS"])
          marke  = f'<meta name="fassung" content="{os.environ["FASSUNG"]}">'
          kopf   = re.compile(r"<head[^>]*>", re.I)

          gestempelt = 0
          for datei in wurzel.rglob("*.html"):
              text = datei.read_text(encoding="utf-8")
              if 'name="fassung"' in text:
                  continue
              neu, anzahl = kopf.subn(lambda m: m.group(0) + "\n  " + marke, text, count=1)
              if anzahl:
                  datei.write_text(neu, encoding="utf-8")
                  gestempelt += 1

          print(f"{gestempelt} Datei(en) gestempelt")
          PY
        env:
          ERGEBNIS: ${{ steps.beschreibung.outputs.ergebnis }}
          FASSUNG: ${{ steps.fassung.outputs.fassung }}

      # ── Wann wechselt der Aushang das naechste Mal? ─────────────────────
      # Damit die Werkstatt merken kann, wenn das Nachbacken ausbleibt.
      #
      # Gerechnet wird hier, nicht drueben: Die Zeitlogik (Rhythmus,
      # Feiertage, Urlaube, Sommerzeit) steht in der aushang-Bibliothek.
      # Sie in Python nachzubauen hiesse, sie zweimal zu haben — und die
      # zweite Fassung waere die, die still falsch wird. Die Werkstatt
      # vergleicht nur noch Datumsangaben.
      - name: Wechseltermine notieren
        if: ${{ !inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja' }}
        continue-on-error: true
        run: |
          if [ ! -f aushang.toml ] || [ ! -d src/aushang ]; then
            echo "kein Aushang — keine Wechseltermine"; exit 0
          fi
          [ -d node_modules ] && echo "Pakete liegen" || npm ci --silent
          cat > ./wechseltermine.probe.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parse } from 'smol-toml';
          import { AushangSchema } from './src/aushang/src/schema.ts';
          import { wechseltAm, ortsZeit, datumPlus } from './src/aushang/src/aushang.ts';

          const a = AushangSchema.parse(parse(readFileSync('aushang.toml', 'utf8')));
          const heute = ortsZeit(new Date(), a.zeitzone).datum;
          const termine: string[] = [];
          let d = heute;
          // Ein halbes Jahr voraus reicht: Weiter plant kaum eine Ordination,
          // und die Datei entsteht bei jedem Bau neu.
          for (let i = 0; i < 180; i++) {
            if (wechseltAm(a, d)) termine.push(d);
            d = datumPlus(d, 1).datum;
          }
          writeFileSync('wechsel.json', JSON.stringify(
            { erzeugt: heute, zeitzone: a.zeitzone, wechselt_an: termine }, null, 1) + '\n');
          console.log(`${termine.length} Wechseltermin(e), naechster: ${termine[0] ?? '—'}`);
          TS
          npx tsx ./wechseltermine.probe.ts
          rm -f ./wechseltermine.probe.ts
          cat wechsel.json

      # ── Einpacken ───────────────────────────────────────────────────────
      - name: Paket schnüren
        if: ${{ !inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja' }}
        id: paket
        run: |
          ergebnis="${{ steps.beschreibung.outputs.ergebnis }}"
          if [ -z "$(ls -A "$ergebnis" 2>/dev/null)" ]; then
            echo "::error::$ergebnis ist leer — es gibt nichts auszuliefern"; exit 1
          fi
          # Das Paket entsteht ausserhalb des Ergebnisverzeichnisses. Bei
          # Seiten ohne Bau ist ergebnis="." — ein Paket, das dort entstuende,
          # packte sich selbst halbfertig mit ein.
          datei="$RUNNER_TEMP/${{ steps.beschreibung.outputs.name }}-${{ steps.fassung.outputs.fassung }}.tar.gz"

          # Bei Seiten ohne Bau ist die Quelle das Repo. Dann muss alles
          # heraus, was zum Repo gehoert, aber nicht zur Seite. Bei gebauten
          # Seiten steht in dist/ ohnehin nur das Ergebnis; die Liste schadet
          # dort nicht.
          tar czf "$datei" -C "$ergebnis" \
              --exclude=.git --exclude=.github --exclude=.gitignore \
              --exclude=.claude --exclude=.vscode --exclude=.werkzeug \
              --exclude=.DS_Store --exclude=node_modules --exclude=.astro \
              --exclude=auslieferung.toml --exclude=CLAUDE.md \
              --exclude='*.tar.gz' \
              ${{ steps.beschreibung.outputs.zusatz }} \
              .

          echo "datei=$datei" >> "$GITHUB_OUTPUT"
          echo "pruefsumme=$(shasum -a 256 "$datei" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Inhalt:"; tar tzf "$datei" | head -20
          ls -lh "$datei"

      # ── Ablegen ─────────────────────────────────────────────────────────
      # Release statt Artefakt: Artefakte verfallen nach 90 Tagen, und ein
      # Rückzug auf eine ältere Fassung griffe dann ins Leere.
      - name: Release anlegen
        if: ${{ !inputs.nur_bei_aenderung || steps.wechsel.outputs.noetig == 'ja' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marke="f-${{ steps.fassung.outputs.fassung }}"
          # wechsel.json haengt nur an, wenn die Seite einen Aushang hat.
          zusatz=""
          if [ -f wechsel.json ]; then zusatz="wechsel.json"; fi
          # auslieferung.toml haengt als eigenes Anhaengsel am Release und
          # liegt bewusst nicht im Paket: der ausroller braucht sie, das
          # Webwurzelverzeichnis nicht.
          gh release create "$marke" \
            "${{ steps.paket.outputs.datei }}" auslieferung.toml $zusatz \
            --title "$marke" \
            --notes "Fassung ${{ steps.fassung.outputs.fassung }} (Commit ${GITHUB_SHA::7}) von $(git log -1 --format=%cI)

          SHA-256: ${{ steps.paket.outputs.pruefsumme }}" \
            || gh release upload "$marke" \
                 "${{ steps.paket.outputs.datei }}" auslieferung.toml $zusatz --clobber

      # ── Melden ──────────────────────────────────────────────────────────
      # Der ausroller fragt zusätzlich alle 15 Minuten selbst nach; eine
      # verlorene Meldung verschluckt also keine Auslieferung. Deshalb darf
      # dieser Schritt scheitern, ohne den Lauf rot zu färben.
      # `if` kennt den secrets-Kontext nicht — deshalb der Umweg ueber env.
      - name: Der Werkstatt Bescheid geben
        if: env.MELDEN_URL != ''
        continue-on-error: true
        env:
          MELDEN_URL: ${{ secrets.MELDEN_URL }}
          MELDEN_GEHEIMNIS: ${{ secrets.MELDEN_GEHEIMNIS }}
        run: |
          rumpf=$(printf '{"seite":"%s","fassung":"%s","pruefsumme":"%s","repo":"%s"}' \
            "${{ steps.beschreibung.outputs.name }}" "${{ steps.fassung.outputs.fassung }}" \
            "${{ steps.paket.outputs.pruefsumme }}" "$GITHUB_REPOSITORY")
          signatur=$(printf '%s' "$rumpf" \
            | openssl dgst -sha256 -hmac "$MELDEN_GEHEIMNIS" -hex \
            | sed 's/^.* //')
          curl -sS --fail --max-time 20 -X POST "$MELDEN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Werk-Signatur: sha256=$signatur" \
            -d "$rumpf"
